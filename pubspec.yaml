name: regipass
description: "Regipass - üniversite kulüp etkinlik platformu (mobil)."
publish_to: 'none'

version: 1.0.9+11

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # ── Firebase ────────────────────────────────────────────────────────
  # Web tarafındaki js/core/firebase.js karşılığı: Auth + Firestore + Storage.
  firebase_core: ^4.1.1
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.0.2
  # 13.4.5, yeni Xcode/Flutter'da FlutterError icin ikinci kez Error
  # uyumlulugu tanimlayip iOS derlemesini durduruyor. Duzeltme 13.5.0'da.
  firebase_storage: ^13.5.0
  google_sign_in: ^7.1.1

  # ── Durum yönetimi & yönlendirme ────────────────────────────────────
  # onSnapshot dinleyicileri StreamProvider'a, sayfa yönlendirmeleri
  # (window.location.href) go_router redirect guard'larına karşılık gelir.
  flutter_riverpod: ^3.0.1
  go_router: ^17.0.0

  # ── QR ──────────────────────────────────────────────────────────────
  # Okuma: qr-scan-engine.js (BarcodeDetector/jsQR) karşılığı.
  # Üretim (İP-O): cihazda, qr paketiyle (saf Dart) — içerik dışarı gitmez,
  # bilet internetsiz de açılır. Web: js/modules/events/qr-image.js.
  mobile_scanner: ^7.1.2
  qr: ^4.0.0

  # ── Harita ──────────────────────────────────────────────────────────
  # Etkinlik konumu seçici. Mobilde Maps SDK kullanımı ücretsiz ve
  # sınırsızdır; anahtar android/local.properties'ten okunur (bkz.
  # android/app/build.gradle.kts).
  google_maps_flutter: ^2.13.1

  # ── Cihaz yetenekleri ───────────────────────────────────────────────
  geolocator: ^14.0.2          # navigator.geolocation
  image_picker: ^1.1.2         # profil fotoğrafı / etkinlik görseli
  permission_handler: ^12.0.3 # kamera iznini Android/iOS'ta açıkça isteme
  file_picker: ^10.3.4         # kulüp belgeleri (PDF/JPEG/PNG)
  shared_preferences: ^2.5.3   # role-session.js (localStorage/sessionStorage)

  # ── Yardımcılar ─────────────────────────────────────────────────────
  crypto: ^3.0.6               # phone_hints anahtarı için SHA-256
  flutter_svg: ^2.2.1          # marka sembolü (assets/brand/regipass_mark.svg)
  intl: ^0.20.2                # Intl.DateTimeFormat("tr-TR") karşılığı
  http: ^1.5.0                 # Photon/Nominatim geocoding
  url_launcher: ^6.3.1
  connectivity_plus: ^7.3.1
  pdfx: ^2.9.2
  # Katılımcı listesini Excel dosyası olarak dışa aktarma (web'deki
  # `downloadStudentsAsExcel` karşılığı). Mobilde tarayıcı indirmesi yok:
  # dosya geçici dizine yazılıp paylaşım sayfasına verilir.
  path_provider: ^2.1.5
  share_plus: ^12.0.0
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  cloud_functions: ^6.4.0
  firebase_messaging: ^16.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/brand/
    # Font lisansları (SIL OFL 1.1) — LicenseRegistry'ye main() içinde eklenir.
    - assets/fonts/OFL-Montserrat.txt
    - assets/fonts/OFL-Inter.txt

  # Web ile aynı yazı aileleri (css/ds.css): başlıklar Montserrat, gövde
  # Inter. google/fonts deposundaki değişken fontlardan statik ağırlıklar
  # (Latin + Latin Ext.) olarak çıkarıldı; lisans: SIL OFL 1.1.
  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700
        - asset: assets/fonts/Montserrat-ExtraBold.ttf
          weight: 800
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
