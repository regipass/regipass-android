# iOS derlemesi — macOS runner'da imzasiz arsiv uretir.
#
# NEDEN IMZASIZ: imzali bir .ipa uretmek dagitim sertifikasi (.p12),
# parolasi, provisioning profile ve Team ID gerektirir; bunlar Apple
# Developer hesabindan alinir ve depoya konamaz. Imzasiz derleme hicbir
# sir istemez ve asil sorulan seyi yanitlar: "iOS tarafi gercekten
# derleniyor mu?" — pod cozumlemesi, Swift/ObjC eklenti derlemesi ve
# Xcode arsivi dahil.
#
# Imzalamayi eklemek icin: asagidaki "build-signed" isini yorumdan
# cikarin ve dort secret'i deponun Settings > Secrets bolumune girin.

name: iOS derleme

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Actions sekmesinden elle de calistirilabilir.
  workflow_dispatch:

jobs:
  build-unsigned:
    name: Imzasiz iOS derlemesi
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          # Yerel gelistirme surumuyle ayni tutuldu; degistirirken
          # pubspec.yaml icindeki sdk kisitini da gozden gecirin.
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Bagimliliklari cek
        run: flutter pub get

      # Maps.xcconfig .gitignore'da: Google Maps anahtari depoya girmiyor.
      # Debug/Release.xcconfig bu dosyayi `#include?` ile ISTEGE BAGLI olarak
      # okur, yani dosya olmasa da derleme gecer — yalnizca harita gri kalir.
      # Secret tanimliysa buraya yazilir, tanimli degilse bos gecer.
      - name: Maps anahtarini yaz
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: echo "MAPS_API_KEY=$MAPS_API_KEY" > ios/Flutter/Maps.xcconfig

      - name: Statik analiz
        run: flutter analyze

      - name: Testler
        run: flutter test

      # pod install ayri bir adim: en sik burada patliyor (deployment target
      # uyusmazligi, pod cozumleme catismasi). Ayri adim olunca hata
      # loglarda tek basina gorunur.
      - name: CocoaPods bagimliliklarini kur
        run: |
          cd ios
          pod install --repo-update

      - name: iOS derlemesi (imzasiz)
        run: flutter build ios --release --no-codesign

      - name: Derleme ciktisini yukle
        uses: actions/upload-artifact@v4
        with:
          name: Runner-app-unsigned
          path: build/ios/iphoneos/Runner.app
          retention-days: 14
          if-no-files-found: error

  # ── Imzali IPA ──────────────────────────────────────────────────────
  #
  # Asagidaki isi kullanmak icin once su dort secret'i ekleyin
  # (Settings > Secrets and variables > Actions):
  #
  #   IOS_DIST_CERT_P12     Dagitim sertifikasi, base64:
  #                         base64 -i cert.p12 | pbcopy
  #   IOS_CERT_PASSWORD     .p12 disa aktarilirken verilen parola
  #   IOS_PROVISION_PROFILE Provisioning profile, base64:
  #                         base64 -i profile.mobileprovision | pbcopy
  #   APPLE_TEAM_ID         Apple Developer > Membership > Team ID
  #
  # Sonra bu blogun yorumunu kaldirin ve ExportOptions.plist'teki
  # provisioning profile adini kendi profilinizin adiyla degistirin.
